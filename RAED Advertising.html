<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAED Advertising</title>
<style>
:root{--c:#00eeea;--n:#040a1c;--n2:#0a1738;--n3:#12285a;--t:#e8f4ff;--m:#8fa6c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:100%}
*{box-sizing:border-box;margin:0}
body{min-height:100%;background:radial-gradient(1200px 700px at 80% -10%,#0d2a6b55,transparent),var(--n);color:var(--t);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
.w{width:min(1120px,100% - 40px);margin:auto}
section{padding:96px 0}
.rv{transition:opacity .8s,transform .8s}.js .rv:not(.in){opacity:0;transform:translateY(28px)}
h1{font-size:clamp(2.3rem,5.6vw,4.2rem);line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.02em;margin-bottom:14px}
.k{color:var(--c);letter-spacing:.2em;font-size:.75rem;text-transform:uppercase;margin-bottom:12px;display:block}
.mut{color:var(--m)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;border:1px solid #00eeea66;background:transparent;cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--c);box-shadow:0 0 28px #00eeea44}
.btn.p{background:var(--c);color:#031027;font-weight:600;border-color:var(--c)}
.nav{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;z-index:20;backdrop-filter:blur(14px);background:#040a1cb3;border-bottom:1px solid #ffffff10}
.nav .w{display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav img{height:34px}.nav nav{display:flex;gap:26px;align-items:center}.nav nav a{color:var(--m);font-size:.92rem;transition:.2s}.nav nav a:hover{color:var(--c)}
#mb{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer}
.hero{min-height:100vh;display:flex;align-items:center;padding-top:110px}
.hero .w{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero p{margin:22px 0 32px;max-width:480px;color:var(--m);font-size:1.1rem}.hero .btn{margin:0 10px 10px 0}
.stage{perspective:1100px;display:grid;place-items:center;min-height:360px}
.fl{transform-style:preserve-3d;animation:fl 7s ease-in-out infinite;width:min(440px,92%)}
@keyframes fl{50%{transform:translateY(-16px)}}
.plate{position:relative;aspect-ratio:1.25;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-14deg));transition:transform .2s ease-out}
.plate>*{position:absolute}
.p0{inset:0;border:1px solid var(--c);border-radius:26px;transform:translateZ(-70px) scale(1.1);opacity:.35;box-shadow:0 0 60px #00eeea33}
.p1{inset:0;border-radius:26px;background:linear-gradient(145deg,var(--n3),var(--n2));border:1px solid #00eeea44;display:grid;place-items:center;box-shadow:0 40px 80px #0009}
.p1 img{width:78%}
.chip{padding:8px 16px;border-radius:99px;background:#061334;border:1px solid var(--c);color:var(--c);font-size:.8rem;transform:translateZ(80px);box-shadow:0 12px 30px #0008}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:36px}
.card{padding:30px 26px;border-radius:20px;background:linear-gradient(160deg,#12285a88,#0a173888);border:1px solid #ffffff14;transition:transform .2s ease-out,border-color .3s}
.card:hover{border-color:#00eeea66}.card b{color:var(--c);font-size:.8rem;letter-spacing:.15em}.card h3{margin:10px 0 8px;font-size:1.2rem}.card p{color:var(--m);font-size:.95rem}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.abt p{color:var(--m);font-size:1.1rem}
.gc{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid #ffffff14;background:var(--n2);cursor:pointer;padding:0;transition:transform .2s ease-out;text-align:left}
.gc img,.ph{width:100%;height:100%;object-fit:cover;transition:transform .6s}.gc:hover img{transform:scale(1.07)}
.ph{background:linear-gradient(135deg,var(--n3),var(--n2));display:block}
.gc span{position:absolute;inset:auto 0 0;padding:44px 20px 16px;background:linear-gradient(transparent,#040a1ce6);display:flex;justify-content:space-between;align-items:end}
.gc small{color:var(--c)}
.back{background:none;border:0;color:var(--c);cursor:pointer;margin:20px 0 6px}
.pg{columns:3 240px;gap:14px;margin-top:18px}.pg img{width:100%;margin-bottom:14px;border-radius:14px;cursor:zoom-in;border:1px solid #ffffff12}
#lb{position:fixed;inset:0;background:#020612f2;z-index:60;display:none;place-items:center;padding:20px}#lb.on{display:grid}
#lb img{max-height:88vh;border-radius:12px}#lb button{position:absolute;background:#0a1738;border:1px solid var(--c);color:var(--c);width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:1.3rem}
.ct{text-align:center;padding:56px 24px;border-radius:28px;background:linear-gradient(160deg,var(--n3),var(--n2));border:1px solid #00eeea33}
.ct p{color:var(--m);margin:8px 0}
footer{padding:36px 0;border-top:1px solid #ffffff10;color:var(--m);font-size:.85rem}footer .w{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}footer img{height:26px;cursor:default}
#adm{position:fixed;inset:0;z-index:80;background:var(--n);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 60px}
#adm[hidden]{display:none}.ad{max-width:860px;margin:auto}
#adm input,#adm textarea{width:100%;background:#0a1738;border:1px solid #ffffff22;border-radius:10px;padding:10px 12px;margin-top:4px}
#adm input:focus,#adm textarea:focus{outline:0;border-color:var(--c)}
#adm label{display:block;margin:12px 0;font-size:.85rem;color:var(--m)}
#adm button{background:#0a1738;border:1px solid #ffffff2a;border-radius:10px;padding:8px 14px;cursor:pointer}#adm button:hover{border-color:var(--c)}
#adm .p{background:var(--c);color:#031027;font-weight:600;border-color:var(--c)}#adm .dn{color:#ff8a8a}
.tabs{display:flex;gap:8px;margin:18px 0}.tabs .on{background:var(--c)!important;color:#031027;font-weight:600}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row label{flex:1;min-width:180px}
.box{border:1px solid #ffffff1c;border-radius:16px;padding:16px;margin:16px 0;background:#0a173866}
.dz{border:2px dashed #00eeea55;border-radius:14px;padding:26px;text-align:center;color:var(--m);cursor:pointer;margin:10px 0}.dz.ov{background:#00eeea18;border-color:var(--c)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.th div{position:relative}.th img{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
.th button{position:absolute;top:4px;padding:2px 8px!important}.th button:nth-of-type(1){left:4px}.th button:nth-of-type(2){right:4px}
@media(max-width:820px){.hero .w,.abt{grid-template-columns:1fr}.stage{min-height:300px}section{padding:72px 0}
#mb{display:block}.nav nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#040a1cf5;padding:18px;display:none;gap:16px}.nav nav.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
